<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (document.querySelector('.papers-display-control')) {
      document.body.classList.add('papers-page');
    }

    if (document.querySelector('.project-panel-list')) {
      document.body.classList.add('projects-page');
    }

    const pruneThemePicker = () => {
      const allowedThemes = new Set(['Default', 'PoliTO', 'Polito', 'Minimal', 'Ocean']);
      const modeLabels = new Set(['Light', 'Dark', 'System', 'Auto']);
      document.querySelectorAll('[id*="theme" i], [class*="theme" i], [aria-label*="theme" i]').forEach((container) => {
        container.querySelectorAll('a, button, label, option').forEach((option) => {
          const label = option.textContent.trim().replace(/\s+/g, ' ');
          if (!label || allowedThemes.has(label) || modeLabels.has(label)) return;
          const lowerLabel = label.toLowerCase();
          if (lowerLabel.includes('theme') || lowerLabel.includes('mode')) return;

          if (option.tagName === 'OPTION') {
            option.remove();
            return;
          }

          const listItem = option.closest('li');
          if (listItem && container.contains(listItem)) {
            listItem.remove();
          } else {
            option.remove();
          }
        });
      });
    };

    pruneThemePicker();
    window.setTimeout(pruneThemePicker, 250);

    const interestLinks = {
      'Wave Energy Converters': '/tags/wave-energy-converters/',
      'Model Predictive Control': '/tags/model-predictive-control/',
      'Data-Driven Control': '/tags/data-driven-control/',
      'Constrained Optimization': '/tags/constrained-optimization/',
      'System Identification': '/tags/system-identification/'
    };

    document.querySelectorAll('.ul-interests li, span.cursor-default').forEach((item) => {
      const label = item.textContent.trim();
      const href = interestLinks[label];
      if (!href || item.querySelector('a')) return;

      const link = document.createElement('a');
      link.href = href;
      link.textContent = label;
      item.textContent = '';
      item.appendChild(link);
    });

    document.querySelectorAll('p, h3').forEach((item) => {
      const match = item.textContent.trim().match(/^\[([^\]]+)\]\(([^)]+)\)$/);
      if (!match || item.querySelector('a')) return;

      const link = document.createElement('a');
      link.href = match[2];
      link.textContent = match[1];
      link.className = 'publication-linked-education';
      item.textContent = '';
      item.appendChild(link);
    });

    const formatDate = (value) => {
      const date = new Date(`${value}T00:00:00`);
      return date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    };

    document.querySelectorAll('p').forEach((item) => {
      const match = item.innerHTML.trim().match(/^(\d{4}-\d{2}-\d{2})<br>(\d{4}-\d{2}-\d{2})$/);
      if (!match) return;
      item.textContent = `${formatDate(match[1])} - ${formatDate(match[2])}`;
    });
  });
</script>
