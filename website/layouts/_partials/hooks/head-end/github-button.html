          const lowerLabel = label.toLowerCase();
          if (lowerLabel.includes('theme') || lowerLabel.includes('mode')) return;

          if (option.tagName === 'OPTION') {
            option.remove();
            return;
          }

          const listItem = option.closest('li');
          if (listItem && container.contains(listItem)) {
